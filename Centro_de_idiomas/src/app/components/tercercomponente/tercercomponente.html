<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <aside>
        <section class="py-5 bg-light border-top">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-8">

                        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                            <div class="bg-primary text-white p-4 text-center">
                                <span class="badge bg-light text-primary mb-2 fw-semibold">Soporte y Admisión
                                    2026</span>
                                <h3 class="fw-bold mb-1">¿Necesitas asesoría personalizada?</h3>
                                <p class="mb-0 text-white-50 small">
                                    Completa el formulario y un asesor académico del Centro de Idiomas te responderá al
                                    instante.
                                </p>
                            </div>

                            <div class="card-body p-4 p-md-5">
                                <form>
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label for="nombre" class="form-label fw-semibold small">Nombre
                                                completo</label>
                                            <div class="input-group">
                                                <span class="input-group-text bg-light"><i
                                                        class="bi bi-person"></i></span>
                                                <input type="text" class="form-control" id="nombre"
                                                    placeholder="Ej. Juan Pérez" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="email" class="form-label fw-semibold small">Correo electrónico
                                                institucional o personal</label>
                                            <div class="input-group">
                                                <span class="input-group-text bg-light"><i
                                                        class="bi bi-envelope"></i></span>
                                                <input type="email" class="form-control" id="email"
                                                    placeholder="correo@continental.edu.pe" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="idiomaInteres" class="form-label fw-semibold small">Idioma de
                                                interés</label>
                                            <div class="input-group">
                                                <span class="input-group-text bg-light"><i
                                                        class="bi bi-translate"></i></span>
                                                <select class="form-select" id="idiomaInteres" required>
                                                    <option value="" selected disabled>Selecciona un idioma...</option>
                                                    <option value="ingles">Inglés</option>
                                                    <option value="portugues">Portugués</option>
                                                    <option value="frances">Francés</option>
                                                    <option value="quechua">Quechua</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="modalidad" class="form-label fw-semibold small">Modalidad
                                                preferida</label>
                                            <div class="input-group">
                                                <span class="input-group-text bg-light"><i
                                                        class="bi bi-laptop"></i></span>
                                                <select class="form-select" id="modalidad" required>
                                                    <option value="" selected disabled>Selecciona la modalidad...
                                                    </option>
                                                    <option value="presencial">Presencial</option>
                                                    <option value="virtual">Virtual</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <label for="mensaje" class="form-label fw-semibold small">¿Cuál es tu
                                                consulta o
                                                duda principal?</label>
                                            <textarea class="form-control" id="mensaje" rows="3"
                                                placeholder="Ej. Quisiera saber los horarios disponibles para el nivel intermedio de inglés..."></textarea>
                                        </div>
                                        <div class="col-12 mt-4 text-center">
                                            <button type="submit"
                                                class="btn btn-primary btn-lg w-100 fw-bold py-3 shadow-sm">
                                                <i class="bi bi-send-fill me-2"></i> Enviar consulta a un asesor
                                            </button>
                                            <span class="d-block text-muted small mt-2">
                                                <i class="bi bi-shield-check text-success me-1"></i> Tus datos están
                                                protegidos por las políticas de privacidad universitarias.
                                            </span>
                                        </div>

                                    </div>
                                </form>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>
    </aside>
</body>

</html>
